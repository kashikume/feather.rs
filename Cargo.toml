[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "tools/*"]
# `cargo run` / `cargo build` at the root work on the development app.
default-members = ["apps/testapp"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
feather = { path = "crates/feather" }
feather-build = { path = "crates/feather-build" }
feather-fmesh = { path = "crates/feather-fmesh" }
feather-ui = { path = "crates/feather-ui" }
atlas-creator = { path = "tools/atlas-creator" }
font-creator = { path = "tools/font-creator" }
mesh-converter = { path = "tools/mesh-converter" }

ab_glyph = "0.2"
anyhow = "1"
log = "0.4"
cgmath = "0.18"
crc32fast = "1"
miniz_oxide = "0.8"
png = "0.17"
pretty_env_logger = "0.5"
thiserror = "1"
ttf-parser = "0.25"
tobj = { version = "3", features = ["log"] }
vulkanalia = { version = "=0.25.0", features = ["libloading", "provisional", "window"] }
winit = { version = "0.30", features = ["android-game-activity"] }
spirq = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The mesh converter runs in build scripts on 30 MB of OBJ: optimized, it takes a fraction of a
# second instead of seconds, even in debug builds.
[profile.dev.package.mesh-converter]
opt-level = 3
[profile.dev.package.feather-fmesh]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
